<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>滔滔 · 篝火营地</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
/* ============ 双主题：夜·库洛米 / 昼·美乐蒂 ============ */
:root{
  --pink:#ff9fbb; --pink-deep:#f2678f; --purple:#b19cd9; --cream:#fff5f7;
  --ui-font:"ZCOOL KuaiLe","PingFang SC","Microsoft YaHei",sans-serif;
}
body.theme-night{
  --bg:#171221; --panel:#241b33; --panel2:#2d2240; --line:rgba(177,156,217,.35);
  --ink:#f2e9f5; --ink-soft:#a99cc0; --accent:#ff9fbb; --accent2:#b19cd9;
}
body.theme-day{
  --bg:#fff0f4; --panel:#fffafc; --panel2:#ffeef3; --line:rgba(242,103,143,.3);
  --ink:#5c4550; --ink-soft:#b3939f; --accent:#f2678f; --accent2:#ffb7c5;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:var(--ui-font);background:var(--bg);color:var(--ink);transition:background .5s,color .5s;
  user-select:none;-webkit-user-select:none}
canvas{display:block}

/* ---------- 顶栏 ---------- */
#topbar{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;gap:10px;
  padding:10px 14px;pointer-events:none}
#topbar>*{pointer-events:auto}
#title{display:flex;align-items:baseline;gap:8px;white-space:nowrap;
  background:var(--panel);border:2px solid var(--line);border-radius:22px;padding:6px 16px;
  box-shadow:0 4px 14px rgba(0,0,0,.18)}
#title h1{font-size:19px;letter-spacing:2px;color:var(--accent)}
#title small{font-size:11px;color:var(--ink-soft)}
#search{flex:0 1 190px;min-width:80px;padding:8px 14px;border:2px solid var(--line);border-radius:20px;
  background:var(--panel);color:var(--ink);font-family:inherit;font-size:13px;outline:none}
#search:focus{border-color:var(--accent)}
.tbtn{cursor:pointer;border:2px solid var(--line);background:var(--panel);border-radius:20px;padding:7px 14px;
  font-family:inherit;font-size:13px;color:var(--ink);transition:.15s;white-space:nowrap;
  box-shadow:0 3px 10px rgba(0,0,0,.15)}
.tbtn:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px)}
#themeBtn{font-size:15px}

/* ---------- 工具面板 ---------- */
#panel{position:fixed;top:64px;right:12px;z-index:60;width:240px;background:var(--panel);
  border:2px solid var(--line);border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.25);
  padding:14px;display:none}
#panel.open{display:block}
#panel h4{font-size:13px;color:var(--accent);margin:10px 0 6px;letter-spacing:2px}
#panel h4:first-child{margin-top:0}
#panel .row{display:flex;flex-wrap:wrap;gap:6px}
.pbtn{cursor:pointer;border:2px solid var(--line);background:var(--panel2);border-radius:14px;padding:6px 10px;
  font-family:inherit;font-size:12px;color:var(--ink)}
.pbtn:hover{border-color:var(--accent);color:var(--accent)}
.pbtn.danger{color:#e06666}
.legend-item{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-soft);padding:2px 0}
.lg-dot{width:12px;height:12px;border-radius:50%}
body.view .edit-only{display:none!important}

/* ---------- 抽屉 ---------- */
#drawer{position:fixed;top:0;right:0;bottom:0;width:290px;z-index:70;background:var(--panel);
  border-left:2px solid var(--line);box-shadow:-10px 0 30px rgba(0,0,0,.3);
  transform:translateX(105%);transition:transform .25s;padding:18px;overflow-y:auto;
  border-radius:22px 0 0 22px}
#drawer.open{transform:translateX(0)}
#drawer h3{font-size:18px;color:var(--accent);letter-spacing:1px;margin-bottom:2px}
#drawer .sub{font-size:12px;color:var(--ink-soft);margin-bottom:12px}
#drawer .drow{margin-bottom:10px;font-size:13px}
#drawer .drow b{color:var(--ink-soft);font-weight:400;margin-right:6px}
.rel-item{display:flex;align-items:center;gap:8px;font-size:13px;padding:7px 9px;border:2px solid var(--line);
  border-radius:12px;margin-bottom:6px;background:var(--panel2)}
.rel-item .rm{margin-left:auto;cursor:pointer;color:#e06666;border:none;background:none;font-size:14px}
#drawer .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}

/* ---------- 弹窗 ---------- */
.modal{position:fixed;inset:0;z-index:100;background:rgba(20,10,25,.55);display:none;
  align-items:center;justify-content:center;backdrop-filter:blur(3px)}
.modal.open{display:flex}
.mbox{background:var(--panel);border:2px solid var(--line);border-radius:20px;width:92%;max-width:400px;
  padding:20px;box-shadow:0 16px 46px rgba(0,0,0,.4);max-height:85vh;overflow-y:auto}
.mbox h3{font-size:16px;margin-bottom:14px;color:var(--accent)}
.mbox label{display:block;font-size:12px;color:var(--ink-soft);margin:8px 0 3px}
.mbox input,.mbox select{width:100%;padding:9px 12px;border:2px solid var(--line);border-radius:12px;
  background:var(--panel2);color:var(--ink);font-family:inherit;font-size:14px;outline:none}
.mbox .mrow{display:flex;gap:8px;margin-top:16px}
.mbox .mrow .tbtn{flex:1;text-align:center}
.btn-primary{background:var(--accent)!important;color:#fff!important;border-color:var(--accent)!important}

/* ---------- 提示 ---------- */
#toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);z-index:200;background:var(--panel);
  border:2px solid var(--line);color:var(--ink);padding:8px 20px;border-radius:22px;font-size:13px;
  opacity:0;transition:.25s;pointer-events:none;box-shadow:0 6px 20px rgba(0,0,0,.25)}
#toast.show{opacity:.96}
#hint{position:fixed;bottom:12px;left:0;right:0;text-align:center;pointer-events:none;z-index:40;
  font-size:12px;letter-spacing:2px;color:var(--ink-soft);opacity:.7}

/* ---------- 开场：库洛米&美乐蒂探头 ---------- */
#intro{position:fixed;inset:0;z-index:999;display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:20px;background:var(--bg);transition:opacity .6s;overflow:hidden}
#intro.out{opacity:0;pointer-events:none}
#intro .mascots{display:flex;gap:34px;align-items:flex-end}
.mascot{width:130px;height:auto;filter:drop-shadow(0 6px 14px rgba(0,0,0,.35));animation:bob 2.2s ease-in-out infinite}
.mascot.m2{animation-delay:.5s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
#intro .ititle{font-size:52px;letter-spacing:14px;color:var(--accent);
  opacity:0;animation:pop .6s cubic-bezier(.3,1.6,.5,1) .5s forwards;text-shadow:0 4px 20px rgba(242,103,143,.35)}
@keyframes pop{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:scale(1)}}
@keyframes fade{to{opacity:.9}}
#intro .istar{position:absolute;font-size:16px;animation:tw 1.6s ease-in-out infinite;opacity:.8}
@keyframes tw{0%,100%{transform:scale(.7);opacity:.4}50%{transform:scale(1.15);opacity:.95}}

@media (max-width:640px){
  #topbar{flex-wrap:wrap;gap:7px;padding:8px 10px}
  #title h1{font-size:15px}
  #title small{display:none}
  #search{order:5;flex:1 1 100%}
  .tbtn{padding:7px 10px;font-size:12px}
  #panel{right:8px;left:8px;width:auto;max-height:55vh;overflow-y:auto}
  #drawer{top:auto;left:0;right:0;bottom:0;width:auto;height:60%;border-left:none;border-radius:22px 22px 0 0;
    transform:translateY(105%)}
  #drawer.open{transform:translateY(0)}
  #intro .ititle{font-size:26px;letter-spacing:5px}
  .mascot{width:82px}
}
</style>
</head>
<body class="theme-night view">

<!-- 开场 -->
<div id="intro">
  <div class="mascots">
    <img class="mascot" src="assets/kuromi.png" alt="库洛米">
    <img class="mascot m2" src="assets/melody.png" alt="美乐蒂">
  </div>
  <div class="ititle">滔 滔</div>
</div>
<script>
/* 封面谢幕独立于此，任何后续脚本出错都不影响 */
(function(){
  const marks = ['⭐','🎀','💜','🌙','✨','🖤','🌸','⭐','✨','🎀'];
  const intro = document.getElementById('intro');
  marks.forEach(m=>{
    const s = document.createElement('div');
    s.className='istar'; s.textContent=m;
    s.style.left = (6+Math.random()*88)+'%';
    s.style.top = (5+Math.random()*80)+'%';
    s.style.animationDelay = (Math.random()*1.4)+'s';
    intro.appendChild(s);
  });
  setTimeout(()=>intro.classList.add('out'), 3900);
  setTimeout(()=>intro.remove(), 4800);
})();
</script>

<!-- 顶栏 -->

<div id="panel">

<div class="modal" id="personModal">

<script src="lib/three.min.js"></script>
<script src="lib/OrbitControls.js"></script>
<script>
/* ================= 初始数据（示例，可导入替换） ================= */
const INITIAL_DATA = {
 "people": [
  {"id":"桃桃","name":"","avatar":"","x":null,"z":null},
  {"id":"栗子","name":"","avatar":"","x":null,"z":null},
  {"id":"年糕","name":"","avatar":"","x":null,"z":null},
  {"id":"布丁","name":"","avatar":"","x":null,"z":null},
  {"id":"奶盖","name":"","avatar":"","x":null,"z":null},
  {"id":"团团","name":"","avatar":"","x":null,"z":null},
  {"id":"圆圆","name":"","avatar":"","x":null,"z":null},
  {"id":"芝麻","name":"","avatar":"","x":null,"z":null},
  {"id":"花椒","name":"","avatar":"","x":null,"z":null},
  {"id":"可乐","name":"","avatar":"","x":null,"z":null},
  {"id":"雪碧","name":"","avatar":"","x":null,"z":null},
  {"id":"豆芽","name":"","avatar":"","x":null,"z":null},
  {"id":"毛豆","name":"","avatar":"","x":null,"z":null},
  {"id":"西米","name":"","avatar":"","x":null,"z":null},
  {"id":"露比","name":"","avatar":"","x":null,"z":null}
 ],
 "edges": [
  {"a":"桃桃","b":"栗子","type":"xiayuan"},
  {"a":"桃桃","b":"年糕","type":"jieyi"},
  {"a":"栗子","b":"年糕","type":"jieyi"},
  {"a":"布丁","b":"奶盖","type":"xiayuan"},
  {"a":"团团","b":"圆圆","type":"jieyi"},
  {"a":"芝麻","b":"花椒","type":"jieyi"},
  {"a":"可乐","b":"雪碧","type":"xiayuan"},
  {"a":"豆芽","b":"毛豆","type":"xiayuan"},
  {"a":"西米","b":"露比","type":"jieyi"},
  {"a":"桃桃","b":"奶盖","type":"jieyi"},
  {"a":"圆圆","b":"露比","type":"xiayuan"},
  {"a":"花椒","b":"可乐","type":"jieyi"},
  {"a":"栗子","b":"西米","type":"jieyi"},
  {"a":"团团","b":"桃桃","type":"shifu"},
  {"a":"桃桃","b":"豆芽","type":"biwai"}
 ]
};

/* ================= 常量与状态 ================= */
const LS_KEY = "campfire_v1";
const REL_COLOR = { jieyi:0xffd166, xiayuan:0xff6b9d, shifu:0xb19cd9, biwai:0x8fd4c1 };
const REL_CSS   = { jieyi:"#ffd166", xiayuan:"#ff6b9d", shifu:"#b19cd9", biwai:"#8fd4c1" };
const REL_NAME  = { jieyi:"结义", xiayuan:"侠缘", shifu:"师徒", biwai:"编外师徒" };
const REL_DIR   = { shifu:true, biwai:true };   // 有向关系：a = 师父，b = 徒弟（线上箭头 师→徒）
const CIRCLE_R = 9, GROUND_R = 17;
/* 小动物的物种与糖果色（loadData 迁移要用，定义须在 data 加载前） */
const SPECIES_KEYS = ['bunny','dog','cat','bear','fox'];
const SPECIES_NAME = { bunny:'垂耳兔', dog:'小狗', cat:'小猫', bear:'小熊', fox:'小狐狸' };
const PALETTE = [0xffd9e4, 0xdcc8f5, 0xc8e2ff, 0xfff0c0, 0xd5f2cc, 0xffe2c8, 0xf7c9d9, 0xcdeee6, 0xf5e6d0, 0xe8d9ff];
function randomSpecies(){ return SPECIES_KEYS[Math.floor(Math.random()*SPECIES_KEYS.length)]; }
function randomColor(){ return PALETTE[Math.floor(Math.random()*PALETTE.length)]; }

let data = loadData();
let selectedId = null, searchHits = new Set();
let undoStack = [];
let editMode = false;
let theme = "night";

/* ================= 数据读写 ================= */
function loadData(){
  let d = null;
  try{
    const s = localStorage.getItem(LS_KEY);
    if(s){ const p = JSON.parse(s); if(p && p.people && p.edges) d = p; }
  }catch(e){}
  if(!d) d = JSON.parse(JSON.stringify(INITIAL_DATA));
  // 迁移：过滤已废弃的关系类型（亲友/小号）
  d.edges = (d.edges||[]).filter(e=>REL_NAME[e.type]);
  // 迁移：给没有物种/配色的老数据随机分配并固化
  let changed = false;
  d.people.forEach(p=>{
    if(!p.species){ p.species = randomSpecies(); changed = true; }
    if(p.color==null){ p.color = randomColor(); changed = true; }
  });
  if(changed) localStorage.setItem(LS_KEY, JSON.stringify(d));
  return d;
}
function save(){ localStorage.setItem(LS_KEY, JSON.stringify(data)); cloudDirty = true; updateCloudStatus(); }
function snapshot(){ undoStack.push(JSON.stringify(data)); if(undoStack.length>30) undoStack.shift(); }
function undo(){
  if(!undoStack.length){ toast("没有可撤销的操作"); return; }
  data = JSON.parse(undoStack.pop()); save(); selectedId=null; closeDrawer();
  rebuildPeople(); rebuildLines(); toast("已撤销");
}
function person(id){ return data.people.find(p=>p.id===id); }
function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._tm); t._tm=setTimeout(()=>t.classList.remove('show'),1800);
}
function esc(s){ return String(s??"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* ================= GitHub 云端 ================= */
let cloudDirty = false;
function ghCfg(){ try{ return JSON.parse(localStorage.getItem('campfire_gh')||'{}'); }catch(e){ return {}; } }
function updateCloudStatus(msg){
  const el = document.getElementById('cloudStatus'); if(!el) return;
  const c = ghCfg();
  el.textContent = msg ?? (c.owner ? (cloudDirty?'● 有未发布的修改':'✓ 已与云端一致') : '未配置云端');
}
function openGhModal(){
  const c = ghCfg();
  document.getElementById('ghOwner').value = c.owner||'';
  document.getElementById('ghRepo').value = c.repo||'';
  document.getElementById('ghBranch').value = c.branch||'main';
  document.getElementById('ghToken').value = c.token||'';
  openModal('ghModal');
}
document.getElementById('ghCfgBtn').onclick = openGhModal;
document.getElementById('ghSave').onclick = ()=>{
  const c = { owner:ghOwner.value.trim(), repo:ghRepo.value.trim(),
    branch:ghBranch.value.trim()||'main', token:ghToken.value.trim() };
  localStorage.setItem('campfire_gh', JSON.stringify(c));
  closeModal('ghModal'); updateCloudStatus(); toast("云端设置已保存");
};
/* ---- GitHub 通用写入：409 时重新取 sha 重试 ---- */
async function ghPut(c, path, contentB64, message){
  const api = `https://api.github.com/repos/${c.owner}/${c.repo}/contents/${path}`;
  const headers = { 'Authorization':'Bearer '+c.token, 'Accept':'application/vnd.github+json' };
  const branch = c.branch||'main';
  for(let i=0;i<3;i++){
    const get = await fetch(api+'?ref='+branch, {headers});
    if(get.status===401||get.status===403) return {auth:false};
    const sha = get.ok ? (await get.json()).sha : undefined;
    const put = await fetch(api, { method:'PUT', headers,
      body: JSON.stringify({ message, content:contentB64, sha, branch }) });
    if(put.ok) return {ok:true};
    if(put.status!==409) return {ok:false, status:put.status};
    await new Promise(r=>setTimeout(r, 900));   // 409：sha 过期/并发，重新取再试
  }
  return {ok:false, status:409};
}
async function publish(){
  const c = ghCfg();
  if(!c.owner || !c.repo || !c.token){ openGhModal(); toast("请先完成云端设置"); return; }
  updateCloudStatus('☁ 发布中…');
  try{
    const content = btoa(String.fromCharCode(...new TextEncoder().encode(JSON.stringify(data,null,1))));
    const r = await ghPut(c, 'data.json', content, '篝火营地更新 '+new Date().toLocaleString('zh-CN'));
    if(r.auth===false){ updateCloudStatus(); toast("令牌无效或无权限"); return; }

/* ---- 头像上传 ---- */
function compressImage(file){
  return new Promise((res, rej)=>{
    const img = new Image();
    img.onload = ()=>{
      const s = Math.min(1, 256/Math.max(img.width, img.height));
      const w = Math.max(1, Math.round(img.width*s)), h = Math.max(1, Math.round(img.height*s));
      const cv = document.createElement('canvas'); cv.width=w; cv.height=h;
      cv.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(img.src);
      res(cv.toDataURL('image/jpeg', 0.85).split(',')[1]);
    };
    img.onerror = rej;
    img.src = URL.createObjectURL(file);
  });
}
async function uploadAvatar(id, file){

}

let flamePts = [];
function buildCampfire(){
  // 木柴
  const logMat = new THREE.MeshLambertMaterial({color:0x6b4a2f});
  for(let i=0;i<4;i++){
    const log = new THREE.Mesh(new THREE.CylinderGeometry(.16,.16,2.6,8), logMat);
    log.rotation.z = Math.PI/2; log.rotation.y = i*Math.PI/4 + .4;
    log.position.y = .25; scene.add(log);
  }
  // 石圈
  const stoneMat = new THREE.MeshLambertMaterial({color:0x8a8a92});
  for(let i=0;i<10;i++){
    const a = i/10*Math.PI*2;
    const st = new THREE.Mesh(new THREE.SphereGeometry(.3+Math.random()*.12, 6, 5), stoneMat);
    st.position.set(Math.cos(a)*1.5, .18, Math.sin(a)*1.5);

  fireLight = new THREE.PointLight(0xffa040, 2.4, 26, 1.6);

  for(let i=0;i<N;i++){

      v:.8+Math.random()*1.4, r:Math.random() });

  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  fireParticles = new THREE.Points(geo, new THREE.PointsMaterial({
    size:.34, vertexColors:true, transparent:true, opacity:.95,

function buildStars(){
  const N = 260, pos = new Float32Array(N*3);

    const a=Math.random()*Math.PI*2, e=Math.random()*Math.PI/2.2, r=70+Math.random()*30;

/* 名牌：左侧圆形头像 + 右侧名字 */
function tagTexture(p){
  const cv = document.createElement('canvas'); cv.width=340; cv.height=88;
  const ctx = cv.getContext('2d');
  const sel = selectedId===p.id;
  ctx.fillStyle = sel ? 'rgba(242,103,143,.95)' : 'rgba(30,24,40,.82)';
  roundRect(ctx, 4, 8, 332, 72, 36); ctx.fill();
  if(sel){ ctx.lineWidth=4; ctx.strokeStyle='#ffe9f0'; ctx.stroke(); }
  // 头像圆
  ctx.save();
  ctx.beginPath(); ctx.arc(50, 44, 30, 0, Math.PI*2); ctx.clip();
  ctx.fillStyle='#ffe3ec'; ctx.fillRect(20,14,60,60);
  if(p._img && p._img.complete && p._img.naturalWidth){
    const im=p._img, s=Math.max(60/im.width,60/im.height);
    ctx.drawImage(im, 50-im.width*s/2, 44-im.height*s/2, im.width*s, im.height*s);
  }else{
    ctx.fillStyle='#f2678f'; ctx.font='bold 30px "ZCOOL KuaiLe",sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText((p.id||"?").slice(0,1), 50, 46);
  }
  ctx.restore();
  ctx.beginPath(); ctx.arc(50, 44, 30, 0, Math.PI*2);
  ctx.lineWidth=3; ctx.strokeStyle='rgba(255,255,255,.85)'; ctx.stroke();
  // 名字
  ctx.fillStyle = '#fff'; ctx.font = 'bold 34px "ZCOOL KuaiLe",sans-serif';
  ctx.textAlign='left'; ctx.textBaseline='middle';
  ctx.fillText(p.id + (p.name ? '·'+p.name : ''), 92, 46);
  const t = new THREE.CanvasTexture(cv); t.minFilter = THREE.LinearFilter;
  return t;
}
function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
/* 圆嘟嘟坐姿小动物：面向 +Z，大头短身小短腿 */
function makeCritter(p, i){
  const g = new THREE.Group();
  const sp = p.species || (p.species = randomSpecies());
  const col = (p.color!=null) ? p.color : (p.color = randomColor());
  const mat = new THREE.MeshLambertMaterial({color:col});
  const cream = new THREE.MeshLambertMaterial({color:0xfffaf2});
  const pink = new THREE.MeshLambertMaterial({color:0xffb7c5});
  // 梨形身体（端坐）
  const body = new THREE.Mesh(new THREE.SphereGeometry(.88, 20, 16), mat);
  body.position.y = .82; body.scale.set(1, .88, .82); g.add(body);
  // 白肚皮
  const belly = new THREE.Mesh(new THREE.SphereGeometry(.58, 14, 10), cream);
  belly.position.set(0, .72, .42); belly.scale.set(.8, .75, .45); g.add(belly);
  // 大头（头身比 1:1，三丽鸥比例）
  const head = new THREE.Mesh(new THREE.SphereGeometry(.86, 20, 16), mat);
  head.position.y = 2.1; head.scale.set(1.06, .98, .96); g.add(head);
  g.userData.head = head;
  // 耳朵（按物种）——每只耳朵挂在"耳根枢轴"上，摆动绕耳根转，永远贴合脑袋
  const ears = [];
  function earPivot(bx, by, bz, rz, build){
    const piv = new THREE.Group();
    piv.position.set(bx, by, bz); piv.rotation.z = rz;
    build(piv);
    g.add(piv); ears.push(piv);
  }
  if(sp==='bunny'){
    // 垂耳兔：两只长耳下垂
    for(const s of [-1,1]){
      earPivot(s*.42, 2.68, .2, -s*2.1, piv=>{
        const e = new THREE.Mesh(new THREE.SphereGeometry(.22, 12, 10), mat);
        e.scale.set(.8, 2.6, .6); e.position.set(0, .32, 0); e.rotation.x = .06;
        piv.add(e);
        const ie = new THREE.Mesh(new THREE.SphereGeometry(.11, 8, 6), pink);
        ie.scale.set(.7, 2.2, .35); ie.position.set(s*.02, .3, .13);
        piv.add(ie);
      });
    }
  }else if(sp==='dog'){
    // 小狗：两侧垂耳
    for(const s of [-1,1]){
      earPivot(s*.68, 2.55, 0, s*.5, piv=>{
        const e = new THREE.Mesh(new THREE.SphereGeometry(.26, 12, 10), mat);
        e.scale.set(.7, 1.6, .55); e.position.set(0, -.32, 0);
        piv.add(e);
      });
    }
  }else if(sp==='cat'){
    // 小猫：尖耳 + 粉内耳
    for(const s of [-1,1]){
      earPivot(s*.5, 2.6, 0, -s*.18, piv=>{
        const e = new THREE.Mesh(new THREE.ConeGeometry(.3, .62, 8), mat);
        e.position.set(0, .28, 0); piv.add(e);
        const ie = new THREE.Mesh(new THREE.ConeGeometry(.16, .34, 8), pink);
        ie.position.set(-s*.02, .22, .1); piv.add(ie);
      });
    }
  }else if(sp==='bear'){
    // 小熊：圆耳朵
    for(const s of [-1,1]){
      earPivot(s*.55, 2.58, 0, 0, piv=>{
        const e = new THREE.Mesh(new THREE.SphereGeometry(.3, 12, 10), mat);
        e.position.set(0, .22, 0); piv.add(e);
        const ie = new THREE.Mesh(new THREE.SphereGeometry(.16, 8, 6), cream);
        ie.position.set(0, .22, .18); piv.add(ie);
      });
    }
  }else{
    // 小狐狸：大尖耳 + 白色耳尖
    for(const s of [-1,1]){
      earPivot(s*.48, 2.6, 0, -s*.2, piv=>{
        const e = new THREE.Mesh(new THREE.ConeGeometry(.34, .85, 8), mat);
        e.position.set(0, .4, 0); piv.add(e);
        const tip = new THREE.Mesh(new THREE.ConeGeometry(.15, .3, 8), cream);
        tip.position.set(0, .72, 0); piv.add(tip);
      });
    }
  }
  g.userData.ears = ears;
  ears.forEach(e=>{ e.userData.rz = e.rotation.z; });
  // 小手手（抱在肚前）
  for(const s of [-1,1]){
    const a = new THREE.Mesh(new THREE.SphereGeometry(.24, 10, 8), mat);
    a.position.set(s*.55, .85, .68); g.add(a);
  }
  // 小短腿前伸
  for(const s of [-1,1]){
    const f = new THREE.Mesh(new THREE.SphereGeometry(.3, 12, 10), mat);
    f.scale.set(.9, .6, 1.3); f.position.set(s*.44, .28, .72); g.add(f);
  }
  // 尾巴
  if(sp==='fox'){
    const tail = new THREE.Mesh(new THREE.SphereGeometry(.4, 12, 10), mat);
    tail.scale.set(.7, .9, 1.6); tail.position.set(-.55, .5, -.85); tail.rotation.x = -.5; g.add(tail);
    const tip = new THREE.Mesh(new THREE.SphereGeometry(.22, 10, 8), cream);
    tip.scale.set(.7, .8, 1); tip.position.set(-.55, .25, -1.35); g.add(tip);
  }else if(sp==='cat'){
    const tail = new THREE.Mesh(new THREE.CylinderGeometry(.1, .13, 1.1, 8), mat);
    tail.position.set(-.8, .8, -.5); tail.rotation.z = .5; g.add(tail);
  }else{
    const tail = new THREE.Mesh(new THREE.SphereGeometry(.22, 10, 8), cream);
    tail.position.set(0, .5, -.95); g.add(tail);
  }
  // === 真 3D 五官（半嵌进白脸区：眼鼻嘴腮红都贴合曲面） ===
  // 白色脸区：嵌进头部前侧的扁球
  const patch = new THREE.Mesh(new THREE.SphereGeometry(.56, 18, 14), cream);
  patch.scale.set(1, .88, .5); patch.position.set(0, 2.06, .52); g.add(patch);
  // 眼睛：黑亮球（半嵌）+ 高光点
  const eyeMat = new THREE.MeshLambertMaterial({color:0x2f242b});
  const hlMat = new THREE.MeshBasicMaterial({color:0xffffff});
  for(const s of [-1,1]){
    const eye = new THREE.Mesh(new THREE.SphereGeometry(.075, 10, 8), eyeMat);
    eye.scale.set(1, 1.35, .8); eye.position.set(s*.24, 2.18, .83); g.add(eye);
    const hl = new THREE.Mesh(new THREE.SphereGeometry(.026, 6, 5), hlMat);
    hl.position.set(s*.24-.03, 2.24, .885); g.add(hl);
  }
  // 小粉鼻（半嵌）
  const nose = new THREE.Mesh(new THREE.SphereGeometry(.045, 8, 6), pink);
  nose.scale.z = .8; nose.position.set(0, 2.06, .86); g.add(nose);
  // ω 嘴：两段小弧线贴脸
  const mouthMat = new THREE.MeshBasicMaterial({color:0x6a4a52});
  for(const s of [-1,1]){
    const m = new THREE.Mesh(new THREE.TorusGeometry(.05, .014, 6, 12, Math.PI), mouthMat);
    m.position.set(s*.05, 1.99, .83); m.rotation.z = Math.PI; m.rotation.x = -.12; g.add(m);
  }
  // 腮红（半嵌粉团）
  const blushMat = new THREE.MeshLambertMaterial({color:0xff9fbb});
  for(const s of [-1,1]){
    const b = new THREE.Mesh(new THREE.SphereGeometry(.07, 8, 6), blushMat);
    b.scale.set(1, .8, .4); b.position.set(s*.4, 2.0, .73); g.add(b);
  }
  g.userData.face = patch;  // 标记位（不再换纹理）
  // 头顶名牌
  const earTop = sp==='fox' ? 3.5 : sp==='bunny' ? 3.4 : sp==='cat' ? 3.3 : sp==='bear' ? 3.2 : 2.9;
  const tag = new THREE.Sprite(new THREE.SpriteMaterial({map:tagTexture(p), transparent:true, depthWrite:false}));
  tag.position.set(0, earTop + .7, 0); tag.scale.set(3.4, .88, 1);
  g.add(tag); g.userData.tag = tag;
  g.userData.id = p.id;
  g.userData.species = sp;
  g.userData.height = earTop;
  g.userData.phase = Math.random()*Math.PI*2;   // 待机摇晃相位
  return g;
}
function disposeGroup(g){
  g.traverse(o=>{
    if(o.geometry) o.geometry.dispose();
    if(o.material){
      (Array.isArray(o.material)?o.material:[o.material]).forEach(m=>{ m.map&&m.map.dispose(); m.dispose(); });
    }
  });
}
function refreshSprite(p){ // 刷新名牌（头像在名牌里）
  const g = sprites[p.id]; if(!g) return;
  const tag = g.userData.tag;
  if(tag){ const t2 = tagTexture(p); tag.material.map.dispose(); tag.material.map = t2; tag.material.needsUpdate = true; }
}
function loadAvatarImg(p){
  if(!p.avatar){ refreshSprite(p); return; }
  if(p._img && p._img._src===p.avatar){ refreshSprite(p); return; }
  const img = new Image(); img.crossOrigin = 'anonymous'; img._src = p.avatar;
  img.onload = ()=>{ p._img = img; refreshSprite(p); };
  img.onerror = ()=>{ p._img = null; refreshSprite(p); };
  p._img = img; img.src = p.avatar;
  refreshSprite(p);
}
function faceCenter(g, x, z){ g.rotation.y = Math.atan2(-x, -z); g.userData.baseRot = g.rotation.y; }
function personPos(p, i){
  if(p.x!=null && p.z!=null) return {x:p.x, z:p.z};
  const n = data.people.length;
  const a = (i/n)*Math.PI*2 - Math.PI/2;
  return { x: Math.cos(a)*CIRCLE_R, z: Math.sin(a)*CIRCLE_R };
}
function rebuildPeople(){
  Object.values(sprites).forEach(g=>{ peopleGroup.remove(g); disposeGroup(g); });
  for(const k in sprites) delete sprites[k];
  data.people.forEach((p,i)=>{
    const g = makeCritter(p, i);
    const pos = personPos(p, i);
    g.position.set(pos.x, 0, pos.z);
    faceCenter(g, pos.x, pos.z);
    peopleGroup.add(g); sprites[p.id] = g;
    loadAvatarImg(p);
  });
  rebuildLines();
}

/* ---- 关系线 ---- */
function rebuildLines(){
  edgeLines.length = 0;
  while(linesGroup.children.length){
    const l = linesGroup.children.pop();
    l.geometry.dispose(); l.material.dispose();
  }
  labelGroup.children.slice().forEach(s=>{ labelGroup.remove(s); s.material.map&&s.material.map.dispose(); s.material.dispose(); });
  // 人对分组（多条关系错层）
  const groups = new Map();
  data.edges.forEach(e=>{
    if(!sprites[e.a] || !sprites[e.b]) return;
    const key = [e.a,e.b].sort().join('|');
    if(!groups.has(key)) groups.set(key, []);
    groups.get(key).push(e);
  });
  groups.forEach(list=>{
    list.forEach((e, idx)=>{
      const A = sprites[e.a].position, B = sprites[e.b].position;
      const hA = (sprites[e.a].userData.height||2.9), hB = (sprites[e.b].userData.height||2.9);
      const top = new THREE.Vector3(A.x, A.y+hA, A.z), topB = new THREE.Vector3(B.x, B.y+hB, B.z);
      // 控制点：向篝火中心收 + 抬高，多条关系逐层抬高
      const mid = top.clone().add(topB).multiplyScalar(.5);
      const ctrl = new THREE.Vector3(mid.x*.25, 8 + top.distanceTo(topB)*.28 + idx*1.4, mid.z*.25);
      const curve = new THREE.QuadraticBezierCurve3(top, ctrl, topB);
      const geo = new THREE.BufferGeometry().setFromPoints(curve.getPoints(40));
      const lit = selectedId && (e.a===selectedId || e.b===selectedId);
      const op = selectedId ? (lit ? .95 : .06) : .14;
      const mat = e.type==='biwai'
        ? new THREE.LineDashedMaterial({ color:REL_COLOR[e.type], transparent:true, opacity:op, dashSize:.5, gapSize:.32, linewidth:2 })
        : new THREE.LineBasicMaterial({ color:REL_COLOR[e.type], transparent:true, opacity:op, linewidth:2 });
      const line = new THREE.Line(geo, mat);
      if(e.type==='biwai') line.computeLineDistances();
      line.userData.edge = e; linesGroup.add(line);
      const midPt = curve.getPoint(.5);
      edgeLines.push({line, edge:e, mid:midPt});
      // 有向关系（师徒/编外师徒）：线中后段加箭头锥，指向徒弟
      if(REL_DIR[e.type]){
        const pA = curve.getPoint(.62), tan = curve.getTangent(.62).normalize();
        const cone = new THREE.Mesh(
          new THREE.ConeGeometry(.2, .55, 8),
          new THREE.MeshBasicMaterial({ color:REL_COLOR[e.type], transparent:true, opacity:op }));
        cone.position.copy(pA);
        cone.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), tan);
        cone.userData.edge = e; linesGroup.add(cone);
      }
      // 点亮时加关系名飘签
      if(lit){
        const cv = document.createElement('canvas'); cv.width=160; cv.height=64;
        const c2 = cv.getContext('2d');
        c2.font = 'bold 40px "ZCOOL KuaiLe",sans-serif'; c2.textAlign='center'; c2.textBaseline='middle';
        c2.shadowColor='rgba(0,0,0,.6)'; c2.shadowBlur=8;
        c2.fillStyle = REL_CSS[e.type]; c2.fillText(REL_NAME[e.type], 80, 34);
        const t = new THREE.CanvasTexture(cv);
        const lab = new THREE.Sprite(new THREE.SpriteMaterial({map:t, transparent:true, depthTest:false}));
        lab.position.copy(midPt); lab.scale.set(2.2,.88,1);
        labelGroup.add(lab);
      }
    });
  });
}
function highlight(){ rebuildLines(); Object.values(sprites).forEach(sp=>refreshSprite(person(sp.userData.id))); }

/* ================= 指针交互 ================= */
let downPos = null, dragTarget = null, moved = false;
const groundPlane = new THREE.Plane(new THREE.Vector3(0,1,0), 0);
function toNDC(e){
  const r = renderer.domElement.getBoundingClientRect();
  pointer.x = ((e.clientX-r.left)/r.width)*2-1;
  pointer.y = -((e.clientY-r.top)/r.height)*2+1;
}
function pickSprite(e){
  toNDC(e); raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(peopleGroup.children, true);
  if(!hits.length) return null;
  // 命中的是小动物身体的某个零件，向上找到整只
  let o = hits[0].object;
  while(o && !o.userData.id) o = o.parent;
  return o;
}
function onDown(e){
  downPos = {x:e.clientX, y:e.clientY}; moved = false;
  if(editMode){
    const sp = pickSprite(e);
    if(sp){ dragTarget = sp; controls.enabled = false; }
  }
}
function onMove(e){
  if(!downPos) return;
  if(Math.hypot(e.clientX-downPos.x, e.clientY-downPos.y) > 6) moved = true;
  if(dragTarget){
    toNDC(e); raycaster.setFromCamera(pointer, camera);
    const pt = new THREE.Vector3();
    if(raycaster.ray.intersectPlane(groundPlane, pt)){
      const d = Math.hypot(pt.x, pt.z);
      if(d > GROUND_R){ pt.x *= GROUND_R/d; pt.z *= GROUND_R/d; }
      dragTarget.position.x = pt.x; dragTarget.position.z = pt.z;
      rebuildLines();
    }
  }
}
function onUp(e){
  if(dragTarget){
    const p = person(dragTarget.userData.id);
    if(p && moved){
      snapshot();
      p.x = +dragTarget.position.x.toFixed(2);
      p.z = +dragTarget.position.z.toFixed(2);
      faceCenter(dragTarget, p.x, p.z);  // 拖完重新面向篝火
      save(); rebuildLines();
      toast("位置已记住");
    }
    dragTarget = null; controls.enabled = true;
  }
  if(downPos && !moved){
    const sp = pickSprite(e);
    if(sp) selectPerson(sp.userData.id);
    else { selectedId = null; closeDrawer(); highlight(); }
  }
  downPos = null;
}
function bindPointer(){
  const el = renderer.domElement;
  el.addEventListener('pointerdown', onDown);
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
}

/* ---- 聚焦 ---- */
let camTween = null;
function flyTo(id){
  const sp = sprites[id]; if(!sp) return;
  const p = sp.position;
  const dir = new THREE.Vector3(p.x, 0, p.z).normalize();
  if(dir.lengthSq()<.01) dir.set(0,0,1);
  const camTo = new THREE.Vector3(p.x + dir.x*8, 6, p.z + dir.z*8);
  const tgtTo = new THREE.Vector3(p.x, p.y+2.2, p.z);
  const c0 = camera.position.clone(), t0 = controls.target.clone();
  const tStart = performance.now();
  camTween = ()=>{
    const r = Math.min(1, (performance.now()-tStart)/700), e2 = 1-Math.pow(1-r,3);
    camera.position.lerpVectors(c0, camTo, e2);
    controls.target.lerpVectors(t0, tgtTo, e2);
    if(r>=1) camTween = null;
  };
}
function selectPerson(id){
  selectedId = id; highlight(); openDrawer(id); flyTo(id);
}

/* ================= 抽屉 ================= */
const drawer = document.getElementById('drawer');
function openDrawer(id){
  const p = person(id); if(!p) return;
  const rels = data.edges.filter(e=>e.a===id||e.b===id);
  const relHtml = rels.length ? rels.map(e=>{
    let txt;
    if(REL_DIR[e.type]){
      txt = e.a===id ? `${REL_NAME[e.type]} · 徒弟 ${esc(e.b)}` : `${REL_NAME[e.type]} · 师父 ${esc(e.a)}`;
    }else{
      const other = e.a===id ? e.b : e.a;
      txt = `${REL_NAME[e.type]} · ${esc(other)}`;
    }
    return `<div class="rel-item"><span class="lg-dot" style="background:${REL_CSS[e.type]}"></span>
      <span>${txt}</span>
      <button class="rm edit-only" data-ri="${data.edges.indexOf(e)}" title="解除">✕</button></div>`;
  }).join("") : `<div style="font-size:12px;color:var(--ink-soft)">暂无关系，去建一条吧</div>`;
  drawer.innerHTML = `
    <h3>${esc(p.id)}</h3>
    <div class="sub">${esc(p.name||"")}${p.species?` · ${SPECIES_NAME[p.species]||p.species}`:""}</div>
    <div class="drow"><b>关系 ${rels.length} 条</b></div>${relHtml}
    <div class="acts">
      <button class="pbtn edit-only" id="dEdit">✏️ 编辑资料</button>
      <button class="pbtn edit-only" id="dAvatar">🖼 上传头像</button>
      <button class="pbtn edit-only" id="dRel">🔗 建关系</button>
      ${p.x!=null?`<button class="pbtn edit-only" id="dDock">↺ 回到圆圈位</button>`:""}
      <button class="pbtn danger edit-only" id="dDel">🗑 移出营地</button>
    </div>
    <div class="acts"><button class="pbtn" id="dClose" style="width:100%">关闭</button></div>`;
  drawer.classList.add('open');
  drawer.querySelectorAll('.rm').forEach(b=>b.onclick=()=>{
    snapshot(); data.edges.splice(+b.dataset.ri,1); save(); rebuildLines(); openDrawer(id); toast("关系已解除");
  });
  document.getElementById('dEdit').onclick = ()=>openPersonModal(id);
  document.getElementById('dAvatar').onclick = ()=>{
    const ip = document.createElement('input'); ip.type='file'; ip.accept='image/*';
    ip.onchange = ev=>{ const f=ev.target.files[0]; if(f) uploadAvatar(id, f); };
    ip.click();
  };
  document.getElementById('dRel').onclick = ()=>openRelModal(id);
  const dd = document.getElementById('dDock');
  if(dd) dd.onclick = ()=>{ snapshot(); p.x=null; p.z=null; save(); rebuildPeople(); openDrawer(id); toast("已回到圆圈位"); };
  document.getElementById('dDel').onclick = ()=>{
    if(!confirm(`将「${id}」移出营地？其关系一并解除。`)) return;
    snapshot();
    data.people = data.people.filter(x=>x.id!==id);
    data.edges = data.edges.filter(e=>e.a!==id&&e.b!==id);
    selectedId=null; save(); closeDrawer(); rebuildPeople(); toast("已移出");
  };
  document.getElementById('dClose').onclick = closeDrawer;
}

/* ================= 渲染循环 ================= */
function animate(){
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  const t = (animate._t = (animate._t||0) + dt);
  // 小动物待机动画
  for(const m of mixers) m.update(dt);
  // 火苗上升
  const posAttr = fireParticles.geometry.attributes.position;
  for(let i=0;i<flamePts.length;i++){
    const f = flamePts[i];
    f.y += f.v * .03;
    if(f.y > 2.6){ f.y = .2; f.x = (Math.random()-.5)*.9; f.z = (Math.random()-.5)*.9; }
    posAttr.setXYZ(i, f.x*(1-f.y/3.2), f.y+.4, f.z*(1-f.y/3.2));
  }
  posAttr.needsUpdate = true;
  // 火光摇曳
  fireLight.intensity = THEMES[theme].fireI + Math.sin(t*11)*.35 + Math.sin(t*23+1)*.2;
  // 萤火虫游荡
  if(decor.fireflies && decor.fireflies.visible){
    const fa = decor.fireflies.geometry.attributes.position;
    decor.ffSeed.forEach((f,i)=>{
      fa.setXYZ(i,
        f.x + Math.sin(t*f.s + f.p)*1.2,
        f.y + Math.sin(t*f.s*1.7 + f.p*2)*.6,
        f.z + Math.cos(t*f.s + f.p)*1.2);
    });
    fa.needsUpdate = true;
    decor.fireflies.material.opacity = .5 + Math.sin(t*3)*.35;
  }
  // 云漂移
  decor.clouds.forEach((c,i)=>{
    if(!c.visible) return;
    c.position.x += .008 + i*.002;
    if(c.position.x > 38) c.position.x = -38;
  });
  // 蝴蝶扑翼绕飞
  if(decor.butterfly && decor.butterfly.visible){
    decor.butterfly.children.forEach((b,i)=>{
      const ph = t*.5 + i*2.4;
      b.position.set(Math.cos(ph)*(CIRCLE_R+3.5), 2.2 + Math.sin(t*1.8+i)*.8, Math.sin(ph)*(CIRCLE_R+3.5));
      b.rotation.y = -ph;
      const flap = Math.sin(t*14+i)*.9;
      b.userData.wings[0].rotation.y =  flap;
      b.userData.wings[1].rotation.y = -flap;
    });
  }
  // 小动物待机：轻晃 + 耳朵抖；选中：开心跳
  Object.values(sprites).forEach(g=>{
    const ph = g.userData.phase||0;
    if(g.userData.id===selectedId){
      const hop = Math.abs(Math.sin(t*4.5));
      g.position.y = hop*.5;
      g.rotation.z = Math.sin(t*4.5)*.06;
      (g.userData.ears||[]).forEach((e,i)=>{
        e.rotation.z = (e.userData.rz||0) + Math.sin(t*9+i)*.3;
      });
    }else{
      g.position.y = 0;
      g.rotation.z = Math.sin(t*1.1+ph)*.05;
      g.rotation.y = (g.userData.baseRot||0) + Math.sin(t*.8+ph)*.09;
      (g.userData.ears||[]).forEach((e,i)=>{
        e.rotation.z = (e.userData.rz||0) + Math.sin(t*2.6+ph+i)*.08;
      });
    }
  });
  // 平时缓慢自转
  controls.autoRotate = !selectedId && !editMode;
  controls.autoRotateSpeed = .5;
  if(camTween) camTween();
  controls.update();
  renderer.render(scene, camera);
}

/* ================= 启动 ================= */
try{
  if(typeof THREE === 'undefined') throw new Error('3D 引擎未加载');
  init3D();
  bindPointer();
  rebuildPeople();
}catch(e){
  document.getElementById('hint').textContent = '⚠ 3D 引擎加载失败，请检查 lib 目录后刷新';
  console.error(e);
}
updateCloudStatus();
refreshRemote();
</script>
